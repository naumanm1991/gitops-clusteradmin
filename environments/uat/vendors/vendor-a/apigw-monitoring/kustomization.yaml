apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: uat-apigw-monitoring

resources:
  - ../../../../../base/tenant

patches:
  - target: { kind: Namespace }
    patch: |-
      - op: replace
        path: /metadata/labels/platform.local~1vendor
        value: vendor-a
  - target: { kind: RoleBinding, name: vendor-edit }
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: vendor-a
